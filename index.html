<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tobago Find and Call</title>
    <!-- Bootstrap CSS for layout styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS for your Tobago Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        .directory-container { height: 100vh; overflow-y: scroll; padding: 20px; }
        .featured-card { border: 2px solid #FFD700; background-color: #FFFDF0; }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <!-- LEFT COLUMN: Directory & Categories -->
            <div class="col-md-5 directory-container bg-light">
                <h1 class="my-4 text-primary">Tobago Find & Call</h1>
                <hr>
                
                <!-- Example of a standard listing -->
                <div class="card mb-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Scarborough General Hospital</h5>
                        <p class="card-text text-muted">📍 Signal Hill, Tobago</p>
                        <a href="tel:18686604744" class="btn btn-success">📞 Call Now</a>
                    </div>
                </div>

                <!-- Example of a Paid / Featured listing -->
                <div class="card mb-3 shadow-sm featured-card">
                    <div class="card-body">
                        <span class="badge bg-warning text-dark mb-2">Featured Partner</span>
                        <h5 class="card-title">D Wok Spot</h5>
                        <p class="card-text text-muted">📍 Store Bay Local Road, Tobago</p>
                        <a href="tel:18687601806" class="btn btn-success">📞 Call Now</a>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Visual Map Area -->
            <div class="col-md-7 p-0">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JavaScript library for the Map map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map and focus it directly on Tobago coordinates
        var map = L.map('map').setView([11.2186, -60.6723], 11);

        // Load OpenStreetMap Tiles (Works completely free)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Add a marker pin for Scarborough General Hospital
        L.marker([11.1783, -60.7441]).addTo(map)
            .bindPopup('<b>Scarborough General Hospital</b><br>Signal Hill')
            .openPopup();
    </script>
</body>
</html>
